name: tallermaster
description: Offline tailor shop POS — Urdu UI, orders, measurements, payments & thermal slips.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  sqflite_common_ffi_web: ^1.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  crypto: ^3.0.6
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0B1F33"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
